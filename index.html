<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIGER HACKZ V4 - FINAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:480px;background:#111;border:1px solid #222;border-radius:25px;padding:25px;text-align:center}
.logo{font-size:26px;font-weight:900;color:#00ff88;margin-bottom:15px}
input{width:100%;padding:15px;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff;outline:none;margin-bottom:12px}
button{width:100%;padding:15px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:900;cursor:pointer}
#status{margin-top:15px;font-size:14px;color:#888}
#dl{margin-top:15px;display:none;padding:15px;background:#00ff88;color:#000;border-radius:12px;text-decoration:none;font-weight:900;display:block}
.loader{margin:15px auto;width:30px;height:30px;border:3px solid #222;border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
<div class="logo">TIGER HACKZ V4</div>
<input id="url" placeholder="Paste YouTube link...">
<button onclick="go()">⚡ CONVERT & GET MP3</button>
<div id="status"></div>
<a id="dl" style="display:none" target="_blank">⬇️ DOWNLOAD MP3 NOW</a>
</div>
<script>
async function go(){
 let u=document.getElementById('url').value.trim();
 if(!u)return alert('Link eka danna!');
 let s=document.getElementById('status'), d=document.getElementById('dl');
 s.innerHTML='<div class="loader"></div>Converting... please wait';
 d.style.display='none';
 try{
  let r=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({url:u,aFormat:'mp3',isAudioOnly:true})});
  let j=await r.json();
  if(j.url){s.innerHTML='✅ Converted!';d.href=j.url;d.style.display='block';}
  else throw 'fail';
 }catch(e){
  s.innerHTML='Server busy, trying backup...';
  // backup - direct redirect but only if cobalt fails
  let b=document.getElementById('dl');
  b.href='https://10downloader.com/download?url='+encodeURIComponent(u);
  b.innerHTML='⬇️ DOWNLOAD VIA BACKUP (opens 10downloader)';
  b.style.display='block';
  s.innerHTML='✅ Ready - backup mode';
 }
}
</script></body></html>
