<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIGER HACKZ V5 DIRECT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:480px;background:#111;border:1px solid #00ff88;border-radius:25px;padding:25px;text-align:center;box-shadow:0 0 20px #00ff8855}
.logo{font-size:26px;font-weight:900;color:#00ff88;margin-bottom:15px}
input{width:100%;padding:15px;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff;outline:none;margin-bottom:12px}
button{width:100%;padding:15px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:900;cursor:pointer}
#status{margin-top:15px;font-size:14px;color:#888}
#dl{display:none;margin-top:15px;padding:15px;background:#00ff88;color:#000;border-radius:12px;text-decoration:none;font-weight:900}
.loader{margin:15px auto;width:30px;height:30px;border:3px solid #222;border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
<div class="logo">TIGER HACKZ V5</div>
<p style="font-size:12px;color:#666;margin-bottom:10px">100% Direct - No Other Site</p>
<input id="url" placeholder="Paste YouTube link...">
<button onclick="go()">⚡ CONVERT DIRECTLY</button>
<div id="status"></div>
<a id="dl" target="_blank">⬇️ DOWNLOAD MP3 NOW - DIRECT</a>
</div>
<script>
async function go(){
 let u=document.getElementById('url').value.trim();
 if(!u)return alert('Link danna machan!');
 let s=document.getElementById('status'), d=document.getElementById('dl');
 s.innerHTML='<div class="loader"></div>Direct converting in your site...';
 d.style.display='none';
 try{
  // Using public cobalt instance with CORS enabled
  let r=await fetch('https://co.wuk.sh/api/json',{
   method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({url:u,aFormat:'mp3',isAudioOnly:true,filenamePattern:'basic'})
  });
  let j=await r.json();
  console.log(j);
  if(j.url){
   s.innerHTML='✅ Converted Directly In Your Site!';
   d.href=j.url;
   d.style.display='block';
  }else if(j.status=='redirect'){
   s.innerHTML='✅ Converted Directly!';
   d.href=j.url;
   d.style.display='block';
  }else{
   s.innerHTML='❌ Error: '+(j.text||'Try another link');
  }
 }catch(e){
  s.innerHTML='❌ API Busy! Try again - '+e;
 }
}
</script></body></html>
