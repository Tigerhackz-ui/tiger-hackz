<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIGER HACKZ V3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.card{width:100%;max-width:480px;background:#111;border:1px solid #222;border-radius:25px;padding:25px}
.logo{font-size:26px;font-weight:900;text-align:center;color:#00ff88;margin-bottom:15px}
input{width:100%;padding:15px;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff;outline:none;margin-bottom:12px}
button{width:100%;padding:15px;background:#00ff88;color:#000;border:none;border-radius:12px;font-weight:900;cursor:pointer}
#result{margin-top:15px;border-radius:15px;overflow:hidden;display:none;border:1px solid #00ff88}
#result.show{display:block}
iframe{width:100%;height:450px;border:none;background:white}
.hint{font-size:11px;color:#666;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<div class="logo">TIGER HACKZ V3</div>
<input id="url" placeholder="Paste YouTube / TikTok / FB link...">
<button onclick="convert()">⚡ CONVERT - NO NEW TAB</button>
<div class="hint">Converter opens INSIDE this site. No redirect to other site.</div>
<div id="result">
<iframe id="frame"></iframe>
</div>
</div>
<script>
function convert(){
 let u=document.getElementById('url').value.trim();
 if(!u){alert('Link eka danna machan!');return}
 document.getElementById('result').classList.add('show');
 // This loads converter INSIDE your site - so user stays on Tiger HackZ
 document.getElementById('frame').src='https://ytmp3.la/en2/#url='+encodeURIComponent(u);
}
</script>
</div>
</body>
</html>
