<title>TIGER OPTIMIZER - Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#080808;color:#fff}
.loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:0.6s}
.loading.hide{opacity:0;pointer-events:none}
.tiger-logo{width:115px;height:115px;border-radius:50%;background:radial-gradient(circle,#ffcf4d,#ff8c00);display:flex;align-items:center;justify-content:center;font-size:70px;box-shadow:0 0 50px rgba(255,174,0,0.7);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.load-bar{width:230px;height:5px;background:#222;border-radius:10px;margin-top:22px;overflow:hidden}
.load-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffae00,#ff6a00);animation:load 2.3s forwards}
@keyframes load{to{width:100%}}
.container{max-width:430px;margin:0 auto;padding:18px;padding-bottom:90px}
.header{text-align:center;padding:22px 0}
