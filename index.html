<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiger HackZ</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;padding:20px}.card{max-width:600px;margin:20px auto;background:#151515;border:1px solid #222;border-radius:20px;padding:20px}input{width:90%;padding:12px;border-radius:10px;border:2px solid #333;background:#0e0e0e;color:#fff}button{width:95%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#ff6a00,#ff1a1a);color:#fff;font-weight:800}#res{display:none;margin-top:15px;background:#222;padding:12px;border-radius:10px}a{color:#fff;text-decoration:none;display:block;padding:10px;background:#333;border-radius:8px;margin-top:8px}.primary{background:linear-gradient(90deg,#ff6a00,#ff1a1a)!important}</style></head><body><h1>Video to <span style="color:#ff6a00">MP3</span></h1><p style="opacity:.6">Youtube TikTok FB Auto</p><div class="card"><input id="link" placeholder="Paste link here..."><button onclick="convert()">CONVERT TO MP3</button><div id="loading" style="display:none;margin-top:10px">Loading... 🐯</div><div id="res"><p id="title">Ready!</p><a id="mp3" class="primary" target="_blank">Download MP3</a><a id="mp4" target="_blank">Download MP4</a></div><p style="font-size:11px;opacity:.5;margin-top:20px">POWERED BY <b style="color:#ff6a00">TIGER HACKZ</b></p></div><script>function convert(){var url=document.getElementById('link').value.trim();if(!url){alert('Link danna!');return}document.getElementById('loading').style.display='block';document.getElementById('res').style.display='none';fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,aFormat:'mp3'})}).then(r=>r.json()).then(d=>{loading.style.display='none';res.style.display='block';if(d.url){mp3.href=d.url;mp4.href=d.url}}).catch(e=>{loading.style.display='none';res.style.display='block';var enc=encodeURIComponent(url);mp3.href='https://ytmp3s.nu/en2#url='+enc;mp4.href='https://ssstik.io/en?url='+enc;})}</script></body></html>
